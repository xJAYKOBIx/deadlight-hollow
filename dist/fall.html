<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Deadlight Hollow: The Fall</title><link rel="icon" href="icon.svg">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Saira+Stencil+One&display=swap">
<style>
:root{color-scheme:dark}html,body{margin:0;height:100%;background:#000;color:#e8e0d1;overflow:hidden;font-family:Arial,Helvetica,sans-serif}
#film{position:fixed;inset:0;width:100%;height:100%;display:block}
.overlay{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#000;text-align:center;padding:24px}
.overlay[hidden]{display:none}.overlay small{font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:#8a8478}
.overlay h1{margin:0;font:400 38px/1 'Saira Stencil One',Impact,sans-serif;letter-spacing:.1em;text-transform:uppercase}
.overlay button{margin-top:10px;min-width:168px;min-height:48px;padding:0 24px;border:1px solid #6a645a;border-radius:3px;background:none;color:#e8e0d1;font:700 13px/1 Arial,sans-serif;letter-spacing:.24em;text-transform:uppercase;cursor:pointer}
</style></head><body>
<canvas id="film"></canvas>
<div class="overlay" id="start"><small>Deadlight Hollow · Intro</small><h1>The Fall</h1><button id="watch">Watch</button></div>
<script type="module" src="fall/main.js"></script>
</body></html>
